.info-list{list-style:none;display:grid;gap:10px}

.info-list li span{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:#e5f8e8;color:var(--green-dark);display:grid;place-items:center;font-size:14px}
.chat-card{display:flex;flex-direction:column;height:680px}
.chat-header{background:linear-gradient(135deg,var(--orange),#ffd86d);padding:18px 20px;display:flex;align-items:center;gap:14px;border-bottom:4px solid #fff}
