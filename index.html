<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大園國小圖書館閱讀小幫手</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--orange:#ffb347;--orange-dark:#f28c28;--yellow:#fff3c4;--green:#65b97a;--green-dark:#2f8b57;--cream:#fffdf3;--brown:#7a4d2a;--red:#e94b5f;--shadow:0 12px 30px rgba(88,65,35,.18)}
body{min-height:100vh;font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;background:radial-gradient(circle at top left,#fff3c4 0 20%,transparent 40%),linear-gradient(135deg,#fff7d8 0%,#eaf8e8 48%,#fff3d9 100%);color:#3b2d22;display:flex;align-items:center;justify-content:center;padding:18px}
.page{width:min(1100px,100%);display:grid;grid-template-columns:360px 1fr;gap:22px}
.hero,.chat-card{background:rgba(255,253,243,.92);border:4px solid #fff;border-radius:30px;box-shadow:var(--shadow);overflow:hidden}
.hero{padding:24px;position:relative;min-height:680px}
.hero:before,.hero:after{content:"";position:absolute;border-radius:999px;background:rgba(101,185,122,.16);z-index:0}
.hero:before{width:160px;height:160px;right:-58px;top:-42px}
.hero:after{width:200px;height:200px;left:-82px;bottom:-62px}
.hero-content{position:relative;z-index:1}
.school-badge{display:inline-flex;align-items:center;gap:8px;background:#fff;border:2px solid #ffe19a;border-radius:999px;padding:8px 13px;color:var(--brown);font-weight:800;font-size:14px;box-shadow:0 6px 14px rgba(242,140,40,.12)}
.badge-dot{width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:18px 0 0 var(--orange),36px 0 0 #ef6f6c}
h1{font-size:32px;line-height:1.18;margin:20px 0 10px;color:var(--green-dark);letter-spacing:.5px}
.subtitle{font-size:17px;line-height:1.7;color:#6b4b33;margin-bottom:20px}
.robot-wrap{display:flex;justify-content:center;margin:18px 0 20px}
.robot{width:210px;height:240px;position:relative;animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.antenna{width:8px;height:38px;background:var(--green-dark);border-radius:8px;position:absolute;left:101px;top:0}
.antenna:after{content:"";width:24px;height:24px;border-radius:50%;background:var(--orange);position:absolute;left:-8px;top:-16px;border:4px solid #fff}
.head{width:172px;height:132px;background:linear-gradient(180deg,#ffffff,#eaffed);border:6px solid var(--green);border-radius:38px;position:absolute;left:19px;top:33px;box-shadow:inset 0 -8px 0 rgba(101,185,122,.12)}
.ear{width:30px;height:54px;background:var(--orange);border:5px solid #fff;border-radius:20px;position:absolute;top:75px}
.ear.left{left:0}.ear.right{right:0}
.eye{width:32px;height:32px;background:#2f4b3a;border-radius:50%;position:absolute;top:82px}
.eye.left{left:55px}.eye.right{right:55px}
.eye:after{content:"";width:10px;height:10px;border-radius:50%;background:#fff;position:absolute;left:7px;top:6px}
.cheek{width:25px;height:13px;background:#ff9aaa;border-radius:50%;position:absolute;top:121px;opacity:.85}
.cheek.left{left:45px}.cheek.right{right:45px}
.mouth{width:46px;height:22px;border-bottom:6px solid #2f4b3a;border-radius:0 0 40px 40px;position:absolute;left:82px;top:114px}
.body{width:132px;height:88px;background:linear-gradient(180deg,#ffd978,#ffb347);border:6px solid #fff;border-radius:32px;position:absolute;left:39px;top:150px;box-shadow:0 10px 16px rgba(122,77,42,.13)}
.book-icon{width:54px;height:36px;position:absolute;left:39px;top:24px;background:#fff;border-radius:5px;border:3px solid var(--green-dark)}
.book-icon:before{content:"";position:absolute;left:24px;top:-3px;width:3px;height:36px;background:var(--green-dark)}
.book-icon:after{content:"";position:absolute;left:7px;top:8px;width:12px;height:3px;background:var(--orange);box-shadow:0 8px 0 var(--orange),28px 0 0 var(--orange),28px 8px 0 var(--orange)}
.arm{width:38px;height:15px;background:var(--green);border-radius:999px;position:absolute;top:175px}
.arm.left{left:13px;transform:rotate(-24deg)}.arm.right{right:13px;transform:rotate(24deg)}
.info-card{background:#fff;border:2px dashed #ffd36c;border-radius:22px;padding:16px;margin-top:16px}
.info-card h2{font-size:20px;color:var(--orange-dark);margin-bottom:10px}
.info-list{list-style:none;display:grid;gap:10px}
.info-list li{display:flex;gap:9px;line-height:1.45;font-weight:700;color:#5d442f}
.info-list li span{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:#e5f8e8;color:var(--green-dark);display:grid;place-items:center;font-size:14px}
.chat-card{display:flex;flex-direction:column;height:680px}
.chat-header{background:linear-gradient(135deg,var(--orange),#ffd86d);padding:18px 20px;display:flex;align-items:center;gap:14px;border-bottom:4px solid #fff}
.avatar{width:62px;height:62px;border-radius:22px;background:#fff;border:4px solid var(--green);position:relative;flex:0 0 auto}
.avatar:before,.avatar:after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#284333;top:22px}
.avatar:before{left:15px}.avatar:after{right:15px}
.avatar-mouth{position:absolute;width:24px;height:12px;border-bottom:4px solid #284333;border-radius:0 0 20px 20px;left:15px;top:32px}
.header-text h2{font-size:24px;color:#fff;text-shadow:0 2px 0 rgba(122,77,42,.18)}
.status{font-size:14px;font-weight:800;color:#4f3a22;background:rgba(255,255,255,.72);display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 10px;margin-top:6px}
.status:before{content:"";width:10px;height:10px;background:#54c66a;border-radius:50%;box-shadow:0 0 0 4px rgba(84,198,106,.18)}
.quick-area{padding:14px 16px;background:#fffdf3;border-bottom:2px solid #f9e4a8}
.quick-title{font-weight:900;color:var(--brown);font-size:15px;margin-bottom:10px}
.quick-buttons{display:flex;flex-wrap:wrap;gap:9px}
.quick-btn{border:0;background:#eaf8e8;color:var(--green-dark);font-weight:900;border-radius:999px;padding:10px 14px;cursor:pointer;font-size:15px;box-shadow:0 4px 0 #ccebd1;transition:.18s transform,.18s box-shadow,.18s background}
.quick-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 0 #ccebd1;background:#ddf4e1}
.quick-btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #ccebd1}
.quick-btn:disabled{opacity:.6;cursor:not-allowed}
.messages{flex:1;overflow-y:auto;padding:20px;background:linear-gradient(180deg,#fffaf0,#f7fff6);display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.message{display:flex;gap:10px;align-items:flex-end;max-width:86%}
.message.student{align-self:flex-end;flex-direction:row-reverse}
.mini-avatar{width:36px;height:36px;border-radius:14px;background:#fff;border:3px solid var(--green);position:relative;flex:0 0 auto}
.mini-avatar:before,.mini-avatar:after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:#284333;top:13px}
.mini-avatar:before{left:8px}.mini-avatar:after{right:8px}
.student-icon{width:36px;height:36px;border-radius:50%;background:#ffd86d;border:3px solid #fff;display:grid;place-items:center;font-size:18px;box-shadow:0 4px 12px rgba(122,77,42,.12);flex:0 0 auto}
.bubble{padding:13px 15px;border-radius:20px;line-height:1.65;font-size:16px;box-shadow:0 4px 14px rgba(83,60,33,.1);white-space:pre-line}
.bot .bubble{background:#fff;border-bottom-left-radius:6px;border:2px solid #dff3df;color:#4b3727}
.student .bubble{background:var(--green);color:#fff;border-bottom-right-radius:6px;font-weight:700}
.typing{display:none;align-items:center;gap:10px;max-width:86%}
.typing.show{display:flex}
.typing-dots{background:#fff;border:2px solid #dff3df;border-radius:18px;border-bottom-left-radius:6px;padding:13px 16px;display:flex;gap:5px}
.typing-dots span{width:8px;height:8px;border-radius:50%;background:var(--green);animation:bounce 1s infinite}
.typing-dots span:nth-child(2){animation-delay:.15s}.typing-dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-6px);opacity:1}}
.input-area{padding:14px;background:#fff;border-top:2px solid #f9e4a8;display:flex;gap:10px}
#questionInput{flex:1;border:3px solid #ffe19a;border-radius:18px;padding:13px 15px;font-size:16px;outline:none;background:#fffdf7;color:#3b2d22}
#questionInput:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(101,185,122,.14)}
#questionInput:disabled{background:#f0f0f0;cursor:not-allowed}
.send-btn{border:0;background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;border-radius:18px;padding:0 20px;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #247244;transition:.18s transform,.18s box-shadow}
.send-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 0 #247244}
.send-btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #247244}
.send-btn:disabled{opacity:.6;cursor:not-allowed;box-shadow:none}
.answer-list{margin-left:18px}
.answer-list li{margin:3px 0}
.tag{display:inline-block;background:#fff1bd;color:#8a5a1c;border-radius:999px;padding:2px 8px;font-weight:900;margin-right:3px}
.link-btn{display:inline-block;background:linear-gradient(135deg,#4a90e2,#357abd);color:#fff;text-decoration:none;padding:8px 14px;border-radius:12px;font-weight:900;font-size:14px;margin:6px 4px 4px 0;box-shadow:0 3px 8px rgba(74,144,226,.3);transition:.18s transform,.18s box-shadow}
.link-btn:hover{transform:translateY(-2px);box-shadow:0 5px 12px rgba(74,144,226,.4)}
.link-btn:active{transform:translateY(0)}
.notice-text{font-size:13px;color:var(--red);font-weight:bold;margin-top:2px;display:block}
@media (max-width:900px){body{align-items:flex-start}.page{grid-template-columns:1fr}.hero{min-height:auto}.chat-card{height:72vh;min-height:600px}.robot{transform:scale(.88);margin:-10px 0}.info-card{margin-top:6px}}
@media (max-width:560px){body{padding:10px}.hero,.chat-card{border-radius:22px;border-width:3px}.hero{padding:18px}h1{font-size:26px}.subtitle{font-size:15px}.chat-card{height:76vh;min-height:570px}.chat-header{padding:14px}.avatar{width:52px;height:52px;border-radius:18px}.header-text h2{font-size:20px}.quick-area{padding:12px}.quick-btn{font-size:14px;padding:9px 11px}.messages{padding:14px}.message{max-width:94%}.bubble{font-size:15px;padding:11px 13px}.input-area{padding:10px;gap:8px}#questionInput{font-size:15px;padding:12px}.send-btn{padding:0 15px}.robot-wrap{display:none}}
</style>
</head>
<body>
<main class="page">
<section class="hero" aria-label="閱讀小幫手介紹">
<div class="hero-content">
<div class="school-badge"><span class="badge-dot"></span><span>大園國小圖書館</span></div>
<h1>閱讀小幫手<br>書寶機器人</h1>
<p class="subtitle">可查詢借閱規則、開放時間、借書方式、找書方法與圖書館活動，讓閱讀服務更清楚、更便利。</p>
<div class="robot-wrap" aria-hidden="true">
<div class="robot">
<div class="antenna"></div>
<div class="ear left"></div>
<div class="ear right"></div>
<div class="head"></div>
<div class="eye left"></div>
<div class="eye right"></div>
<div class="cheek left"></div>
<div class="cheek right"></div>
<div class="mouth"></div>
<div class="arm left"></div>
<div class="arm right"></div>
<div class="body"><div class="book-icon"></div></div>
</div>
</div>
<div class="info-card">
<h2>常用資訊</h2>
<ul class="info-list">
<li><span>📚</span><strong>學生每次最多借3本書，借期14天。</strong></li>
<li><span>🕘</span><strong>星期一至五上午8:40開放借書。</strong></li>
<li><span>🌿</span><strong>可使用快速按鈕或輸入問題查詢。</strong></li>
</ul>
</div>
</div>
</section>
<section class="chat-card" aria-label="閱讀小幫手聊天介面">
<header class="chat-header">
<div class="avatar" aria-hidden="true"><div class="avatar-mouth"></div></div>
<div class="header-text">
<h2>書寶閱讀小幫手</h2>
<div class="status">自動回覆服務中</div>
</div>
</header>
<div class="quick-area">
<div class="quick-title">快速問答</div>
<div class="quick-buttons">
<button class="quick-btn" data-question="借閱規則">借閱規則</button>
<button class="quick-btn" data-question="開放時間">開放時間</button>
<button class="quick-btn" data-question="如何借書">如何借書</button>
<button class="quick-btn" data-question="找書方法">找書方法</button>
<button class="quick-btn" data-question="圖書館活動">圖書館活動</button>
<button class="quick-btn" data-question="教師專區">教師專區</button>
<button class="quick-btn" data-question="相關網頁">相關網頁</button>
</div>
</div>
<div class="messages" id="messages" aria-live="polite">
<div class="message bot">
<div class="mini-avatar" aria-hidden="true"></div>
<div class="bubble">哈囉！這裡是大園國小圖書館閱讀小幫手「書寶」。可查詢借閱規則、開放時間、借書方式、找書方法、圖書館活動與教師專區。</div>
</div>
</div>
<div class="typing" id="typing">
<div class="mini-avatar" aria-hidden="true"></div>
<div class="typing-dots" aria-label="書寶正在回覆"><span></span><span></span><span></span></div>
</div>
<form class="input-area" id="chatForm">
<input id="questionInput" type="text" autocomplete="off" placeholder="輸入問題，例如：今天可以借書嗎？" aria-label="輸入問題">
<button class="send-btn" id="sendBtn" type="submit" aria-label="送出問題">送出</button>
</form>
</section>
</main>
<script>
const answers={
borrow:`<span class="tag">借閱規則</span>
<ul class="answer-list">
<li>學生每次最多借3本書。</li>
<li>借期為2週，共14天。</li>
<li>逾期將暫停借書權利。</li>
</ul>`,
time:`<span class="tag">開放時間</span>
<ul class="answer-list">
<li>星期一至五：上午8:40開放借書。</li>
<li>星期一、二、四、五：中午12:00-13:05暫停借書，下午15:30停止借還書。</li>
<li>星期三：中午12:00停止借還書。</li>
</ul>`,
how:`<span class="tag">如何借書</span>
<ul class="answer-list">
<li>在書架上挑選想閱讀的書。</li>
<li>攜帶書籍到借還書櫃台辦理借閱。</li>
<li>一次最多借3本，借期14天。</li>
<li>借閱後妥善保管書籍，期限內歸還。</li>
</ul>`,
find:`<span class="tag">找書方法</span>
<ul class="answer-list">
<li>
